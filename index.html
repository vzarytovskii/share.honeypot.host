<!DOCTYPE html>
<html lang='en' role='main'>
  <head>
    <meta charset='UTF-8' />
    <meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover' />
    <meta name='color-scheme' content='light dark' />
    <meta name='theme-color' content='#fafafa' media='(prefers-color-scheme: light)' />
    <meta name='theme-color' content='#0a0a0a' media='(prefers-color-scheme: dark)' />
    <meta name='description'
      content='A minimal text editor that stores content directly in the URL.'>
    <meta property='og:title' content='Editor' />
    <meta property='og:description' content='A minimal text editor that stores content directly in the URL.' />
    <meta property='og:type' content='website' />
    <meta name='twitter:card' content='summary' />
    <link rel='icon' href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='4' width='22' height='25' rx='3' fill='%23fef3c7' stroke='%23171717' stroke-width='2'/%3E%3Cpath d='M10 2v5m6-5v5m6-5v5M9 12h9m-9 5h6m-6 5h5' fill='none' stroke='%23171717' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='m19 19 6-4m-6 6 6 4' fill='none' stroke='%2316a34a' stroke-width='2'/%3E%3Ccircle cx='18' cy='20' r='3' fill='%2322c55e'/%3E%3Ccircle cx='26' cy='14' r='3' fill='%2322c55e'/%3E%3Ccircle cx='26' cy='26' r='3' fill='%2322c55e'/%3E%3C/svg%3E" />
    <title>Editor</title>
    <style>
      :root {
        --bg: #fafafa;
        --text-primary: #0a0a0a;
        --text-secondary: #737373;
        --border: #e5e5e5;
        --accent: hsl(120, 60%, 45%);
        --accent-text: #fff;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0a;
          --text-primary: #fafafa;
          --text-secondary: #636363;
          --border: #262626;
        }
      }

      @supports (color: Canvas) {
        :root {
          --bg: Canvas;
          --text-primary: CanvasText;
        }
      }

      @supports (color: GrayText) {
        :root {
          --text-secondary: GrayText;
        }
      }

      @supports (color: ButtonBorder) {
        :root {
          --border: ButtonBorder;
        }
      }

      @supports (color: AccentColor) and (color: AccentColorText) {
        :root {
          --accent: AccentColor;
          --accent-text: AccentColorText;
        }
      }

      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        color-scheme: light dark;
        -webkit-text-size-adjust: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-font-smoothing: antialiased;
        text-size-adjust: none;
        hanging-punctuation: first allow-end last;
        interpolate-size: allow-keywords;
        scroll-behavior: smooth;
        scrollbar-gutter: stable;
      }

      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', 'Liberation Sans', sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji';
        background: var(--bg);
        color: var(--text-primary);
        display: flex;
        transition: background-color 0.3s ease, color 0.3s ease;
        line-height: 1.6;
        min-height: 100vh;
        min-height: 100dvh;
        width: 100%;
      }

      main {
        background: var(--bg);
        min-height: 100vh;
        min-height: 100dvh;
        width: 100%;
        padding: 0.5rem;
        outline: none;
        overflow-wrap: break-word;
        word-break: break-word;
        overflow-x: hidden;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .toolbar {
        position: fixed;
        bottom: 1rem;
        right: 0.75rem;
        z-index: 1000;
        display: inline-flex;
        flex-direction: column;
        gap: 0.4rem;
      }

      main:empty::before {
        content: 'Your text goes here…';
        color: var(--text-secondary);
        pointer-events: none;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.3rem;
        background: var(--bg);
        color: var(--text-primary);
        border: 1px solid var(--border);
        border-radius: 0.375rem;
        padding: 0.35rem;
        font-size: 0.75rem;
        font-family: inherit;
        cursor: pointer;
        opacity: 1;
        transition: background-color 0.15s ease, color 0.15s ease;
      }

      .btn:hover,
      .btn:focus-visible {
        background: var(--text-primary);
        color: var(--bg);
      }

      .btn:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 2px;
      }

      .btn svg {
        width: 1rem;
        height: 1rem;
        flex-shrink: 0;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .btn.flash {
        background: var(--accent);
        color: var(--accent-text);
        border-color: var(--accent);
      }

      .usage-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: var(--border);
        z-index: 1000;
      }

      .usage-bar-fill {
        height: 100%;
        width: 0%;
        background: var(--accent);
        transition: width 0.15s ease-out, background-color 0.15s ease-out;
      }

      .usage-bar.full .usage-bar-fill {
        animation: flash 0.6s ease-out;
      }

      @keyframes flash {
        0%, 100% { filter: brightness(1); }
        50% { filter: brightness(1.6); }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>

  <body>
    <main
      contenteditable='true'
      autofocus
      role='textbox'
      aria-multiline='true'
      aria-label='Shared text editor'>
    </main>
    <noscript>
      <p style="padding:1rem">This editor requires JavaScript to compress and store text in the URL.</p>
    </noscript>
    <div class='toolbar' role='toolbar' aria-label='Editor actions'>
      <button class='btn' id='clear-btn' type='button' title='Clear editor' aria-label='Clear editor'>
        <svg viewBox='0 0 24 24' aria-hidden='true'><path d='M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6'/></svg>
      </button>
      <button class='btn' id='share-btn' type='button' title='Share URL' aria-label='Share URL' hidden>
        <svg viewBox='0 0 24 24' aria-hidden='true'><circle cx='18' cy='5' r='3'/><circle cx='6' cy='12' r='3'/><circle cx='18' cy='19' r='3'/><path d='m8.59 13.51 6.83 3.98M15.41 6.51l-6.82 3.98'/></svg>
      </button>
      <button class='btn copy-btn' id='copy-btn' type='button' title='Copy URL (Ctrl/Cmd+Shift+C)' aria-label='Copy URL'>
        <svg viewBox='0 0 24 24' aria-hidden='true'><rect x='9' y='9' width='13' height='13' rx='2'/><path d='M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1'/></svg>
      </button>
    </div>
    <div
      class='usage-bar'
      id='usage-bar'
      title='URL space usage'
      role='progressbar'
      aria-label='URL space used'
      aria-valuemin='0'
      aria-valuemax='100'
      aria-valuenow='0'>
      <div class='usage-bar-fill' id='usage-bar-fill'></div>
    </div>
    <div id='live-region' class='sr-only' role='status' aria-live='polite'></div>
    <script>
      const editor = document.querySelector('main');
      const usageBar = document.getElementById('usage-bar');
      const usageBarFill = document.getElementById('usage-bar-fill');
      const liveRegion = document.getElementById('live-region');

      const maxUrlSize = 50_000; // Some arbitrary limit I found on StackOverflow.
      const baseUrl = window.location.href.split('#')[0];
      const allowedChars = maxUrlSize - baseUrl.length - 1;
      const uncompressedPrefix = '!';
      const compressionFormat = 'deflate-raw';
      const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_.~=?&/[]\'()*+,;$@';
      const lookup = Object.fromEntries(Array.from(alphabet, (char, index) => [char, index]));

      const getHash = () => decodeURIComponent(location.hash.slice(1));
      const getHashLength = () => location.hash.slice(1).length;

      const announce = (msg) => {
        liveRegion.textContent = '';
        setTimeout(() => { liveRegion.textContent = msg; }, 30);
      };

      const updateCharCount = () => {
        const currentLength = getHashLength();
        const percentage = Math.min((currentLength / allowedChars) * 100, 100);

        usageBarFill.style.width = percentage + '%';
        const hue = Math.max(0, 120 - (percentage * 1.2));
        usageBarFill.style.background = `hsl(${hue}, 70%, 50%)`;
        usageBar.setAttribute('aria-valuenow', String(Math.round(percentage)));
      };

      const debounce = (callback, wait) => {
        let timeoutId = null;
        return (...args) => {
          window.clearTimeout(timeoutId);
          timeoutId = window.setTimeout(() => { callback(...args); }, wait);
        };
      };

      const resetCursor = (editor) => {
        const range = document.createRange();
        const sel = window.getSelection();
        range.selectNodeContents(editor);
        range.collapse(false);
        sel.removeAllRanges();
        sel.addRange(range);
      };

      const encode = (bytes) => {
        let zeroes = 0;
        while (zeroes < bytes.length && bytes[zeroes] === 0) zeroes++;

        const digits = [];
        for (const byte of bytes.slice(zeroes)) {
          let carry = byte;
          for (let i = 0; i < digits.length; i++) {
            const value = digits[i] * 256 + carry;
            digits[i] = value % alphabet.length;
            carry = Math.floor(value / alphabet.length);
          }
          while (carry > 0) {
            digits.push(carry % alphabet.length);
            carry = Math.floor(carry / alphabet.length);
          }
        }

        return alphabet[0].repeat(zeroes)
          + digits.reverse().map((digit) => alphabet[digit]).join('');
      };

      const decode = (str) => {
        let zeroes = 0;
        while (zeroes < str.length && str[zeroes] === alphabet[0]) zeroes++;

        const bytes = [];
        for (const char of str.slice(zeroes)) {
          const digit = lookup[char];
          if (digit === undefined) throw new Error('Invalid encoded URL content');

          let carry = digit;
          for (let i = 0; i < bytes.length; i++) {
            const value = bytes[i] * alphabet.length + carry;
            bytes[i] = value & 0xff;
            carry = value >> 8;
          }
          while (carry > 0) {
            bytes.push(carry & 0xff);
            carry >>= 8;
          }
        }

        return Uint8Array.from([
          ...new Uint8Array(zeroes),
          ...bytes.reverse(),
        ]);
      };

      const transformBytes = async (bytes, transform) => {
        const stream = new Blob([bytes]).stream().pipeThrough(transform);
        return new Uint8Array(await new Response(stream).arrayBuffer());
      };

      const compressBytes = (bytes, format) => transformBytes(bytes, new CompressionStream(format));

      const decompressBytes = (bytes, format) => transformBytes(bytes, new DecompressionStream(format));

      const deflate = async (str) => {
        if (!str) return '';
        const data = new TextEncoder().encode(str);

        if (window.CompressionStream) {
          try {
            const compressed = await compressBytes(data, compressionFormat);
            if (compressed.length < data.length) return encode(compressed);
          } catch (err) {
            console.warn('Compression failed, storing content uncompressed:', err);
          }
        }

        return uncompressedPrefix + encode(data);
      };

      const inflate = async (str) => {
        if (!str) return '';
        if (str.startsWith(uncompressedPrefix)) {
          return new TextDecoder().decode(decode(str.slice(1)));
        }
        const bytes = decode(str);
        let decompressed = await decompressBytes(bytes, compressionFormat);
        return new TextDecoder().decode(decompressed);
      };

      const setContent = async (editor, content) => {
        try {
          editor.innerHTML = await inflate(content);
          resetCursor(editor);
        } catch (err) {
          console.warn('Failed to decode URL content:', err);
          editor.innerHTML = '';
          announce('Could not decode URL content. Start typing to create a new share.');
          history.replaceState(null, '', baseUrl);
        }
      };

      const writeHash = (hash) => {
        const url = hash ? baseUrl + '#' + hash : baseUrl;
        history.replaceState(null, '', url);
      };

      let isComposing = false;

      const updateFragment = async (editor) => {
        if (isComposing) return;
        if (editor.innerHTML === '<br>') editor.innerHTML = '';
        try {
          const hash = await deflate(editor.innerHTML);
          writeHash(hash);
          updateCharCount();
        } catch (err) {
          console.warn('Failed to encode content:', err);
        }
      };

      const setFragment = debounce(updateFragment, 200);

      const isAtLimit = () => getHashLength() >= allowedChars;

      const flashLimit = () => {
        usageBar.classList.remove('full');
        void usageBar.offsetWidth;
        usageBar.classList.add('full');
        announce('URL space is full.');
      };

      const NAVIGATION_KEYS = new Set(['Backspace', 'Delete', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End', 'Escape']);
      const SHORTCUT_KEYS = new Set(['a', 'c', 'x', 'z', 'y']);

      const isInsertingContent = (e) => {
        if (NAVIGATION_KEYS.has(e.key)) return false;
        if ((e.ctrlKey || e.metaKey) && SHORTCUT_KEYS.has(e.key.toLowerCase())) return false;
        if (e.shiftKey && e.key.startsWith('Arrow')) return false;
        return true;
      };

      const insertText = (text) => document.execCommand('insertText', false, text);
      const insertLineBreak = () => document.execCommand('insertLineBreak');

      const ALLOWED_TAGS = new Set(['B','STRONG','I','EM','U','A','H1','H2','H3','H4','H5','H6','UL','OL','LI','P','BR','CODE','PRE','BLOCKQUOTE','DIV','SPAN']);
      const ALLOWED_ATTRS = { 'A': new Set(['href', 'style']) };

      const sanitizeNode = (node) => {
        for (const child of Array.from(node.childNodes)) {
          if (child.nodeType === Node.COMMENT_NODE) {
            child.remove();
            continue;
          }
          if (child.nodeType !== Node.ELEMENT_NODE) continue;

          const tag = child.tagName;
          if (tag === 'STYLE' || tag === 'SCRIPT' || tag === 'META' || tag === 'LINK') {
            child.remove();
            continue;
          }

          if (!ALLOWED_TAGS.has(tag)) {
            while (child.firstChild) node.insertBefore(child.firstChild, child);
            child.remove();
            continue;
          }

          const allowed = ALLOWED_ATTRS[tag] || new Set();
          for (const attr of Array.from(child.attributes)) {
            if (!allowed.has(attr.name)) child.removeAttribute(attr.name);
          }
          sanitizeNode(child);
        }
      };

      const handlePaste = (e) => {
        const html = e.clipboardData && e.clipboardData.getData('text/html');
        const text = e.clipboardData && e.clipboardData.getData('text/plain');
        if (!html && !text) return;

        e.preventDefault();

        if (html) {
          const doc = new DOMParser().parseFromString(html, 'text/html');
          const cleaned = doc.body.innerHTML;
          document.execCommand('insertHTML', false, cleaned);
        } else {
          insertText(text);
        }
      };

      document.addEventListener('DOMContentLoaded', () => {
        setContent(editor, getHash());
        updateCharCount();
      });

      editor.addEventListener('compositionstart', () => { isComposing = true; });
      editor.addEventListener('compositionend', () => {
        isComposing = false;
        setFragment(editor);
      });

      editor.addEventListener('input', () => { if (!isComposing) setFragment(editor); });

      editor.addEventListener('paste', handlePaste);

      editor.addEventListener('keydown', (e) => {
        if (isAtLimit() && isInsertingContent(e)) {
          e.preventDefault();
          flashLimit();
          return;
        }

        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          insertLineBreak();
        }

        if (e.key === 'Tab') {
          e.preventDefault();
          insertText('\t');
        }

        if (e.key === 'Escape') {
          editor.blur();
        }
      });

      editor.addEventListener('blur', () => setFragment(editor), { passive: true });

      document.addEventListener('visibilitychange', () => {
        if (document.hidden && !isComposing) setFragment(editor);
      }, { passive: true });

      const copyBtn = document.getElementById('copy-btn');
      const resetCopyFlash = debounce(() => { copyBtn.classList.remove('flash'); }, 1200);

      const copyUrl = async () => {
        const url = window.location.href;
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(url);
          } else {
            const ta = document.createElement('textarea');
            ta.value = url;
            ta.setAttribute('readonly', '');
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            ta.remove();
          }
          copyBtn.classList.add('flash');
          announce('URL copied to clipboard.');
        } catch (err) {
          console.warn('Copy failed:', err);
          announce('Copy failed.');
        }
        resetCopyFlash();
      };

      copyBtn.addEventListener('click', copyUrl);

      document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'c') {
          e.preventDefault();
          copyUrl();
        }
      });

      const clearBtn = document.getElementById('clear-btn');
      clearBtn.addEventListener('click', () => {
        editor.innerHTML = '';
        writeHash('');
        updateCharCount();
        editor.focus();
        announce('Editor cleared.');
      });

      const shareBtn = document.getElementById('share-btn');
      if (navigator.share) {
        shareBtn.hidden = false;
        shareBtn.addEventListener('click', async () => {
          try {
            await navigator.share({ url: window.location.href, title: document.title });
          } catch (err) {
            if (err && err.name !== 'AbortError') console.warn('Share failed:', err);
          }
        });
      }
    </script>
  </body>

</html>
